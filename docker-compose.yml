# Local development, Laravel Sail compatible (`./vendor/bin/sail up -d` once Sail is installed,
# or `docker compose up -d`). Ports default to values that don't clash with ../LMS
# (which uses 80, 5173, 3306, 8080), so both projects can run at the same time.
services:
    laravel.test:
        # Reuses the Sail PHP 8.5 image already built for ../LMS (has pdo_pgsql, node, composer).
        # Once laravel/sail is installed, `build` can point at ./vendor/laravel/sail/runtimes/8.5.
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8000}:80'
            - '${VITE_PORT:-5174}:${VITE_PORT:-5174}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy

    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-password}'
            POSTGRES_DB: '${DB_DATABASE:-sarasystem}'
            POSTGRES_USER: '${DB_USERNAME:-sail}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-password}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE:-sarasystem}'
                - '-U'
                - '${DB_USERNAME:-sail}'
            retries: 3
            timeout: 5s

    # Web UI for browsing the database (phpMyAdmin-like; phpMyAdmin itself is MySQL-only).
    adminer:
        image: 'adminer:latest'
        ports:
            - '${FORWARD_ADMINER_PORT:-8081}:8080'
        environment:
            ADMINER_DEFAULT_SERVER: pgsql
        networks:
            - sail
        depends_on:
            - pgsql

networks:
    sail:
        driver: bridge
        ipam:
            config:
                # Must be inside 172.16.0.0/12, which the host's sshuttle VPN excludes (see docs/conventions.md)
                - subnet: '${SAIL_SUBNET:-172.16.60.0/24}'

volumes:
    sail-pgsql:
        driver: local
